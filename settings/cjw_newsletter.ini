#?ini charset="utf-8"?
# cjw_newsletter.ini contains settings for the newsletter

[NewsletterSettings]

# NodeId of container where the system is looking for newsletter systems
RootFolderNodeId=1

# which is the command to exex php cli scripts
PhpCli=php

# array with all skin names located in design folder
# => design:newsletter/skin/ $skin_name

AvailableSkinArray[]=default


[NewsletterMailSettings]

# smtp, sendmail, file
#
# file is the simulated sending: nothing leaves the server, every mail is written as one .eml file
# <date>-<id>-<recipient>.eml in FileTransportMailDir. Use it to test a whole installation (subscribe, double opt-in,
# send, cron jobs, unsubscribe) without a mail server and without a real recipient: set all three methods to file,
# send, and read the mails in the directory. A relative directory is relative to the installation. The directory
# must be writable by the web server user and by the user of the cron job.
# To send for real set a method to smtp (with the SmtpTransport* settings below) or sendmail.

# newsletter
TransportMethodCronjob=file

# test newsletter (the extension default really sends: set file to keep the test mails in the directory)
TransportMethodPreview=sendmail

# subscribe, infomail
TransportMethodDirectly=file

# where to store mails send by TransportMethod = file
FileTransportMailDir=var/log/mail

# http://ezcomponents.org/docs/api/latest/introduction_Mail.html#mta-qmail
# HeaderLineEnding
#    auto - try to find correct settings
#           default is LF
#    CRLF - windows - \r\n
#    CR   - mac - \r
#    LF   - UNIX-MACOSX - \n
HeaderLineEnding=auto

# email encoding default is 8bit
# 7bit | 8bit | binary | quoted-printable | base64
ContentTransferEncoding=8bit

# Configuration for SMTP
SmtpTransportServer=
SmtpTransportPort=25
SmtpTransportUser=
SmtpTransportPassword=
# Connection type in SMTP: <empty>(no encryption)|ssl|sslv2|sslv3|tls
SmtpTransportConnectionType=

# settings for mail send out by subscribe, unsubscribe
EmailSender=newsletter@example.com
EmailSenderName=Example Newsletter Sender

# Set if you want define a special Reply-To for emails send out by subscribe, unsubscribe
EmailReplyTo=
# Set if you want define a special Return-Path for emails send out by subscribe, unsubscribe
EmailReturnPath=


# string the subject of all mails is starting with; empty (default) = "[Newsletter <host of the site's SiteURL>]"
EmailSubjectPrefix=

# enabled | disabled - if enabled all local images will be include to the mail message
ImageInclude=disabled

[BounceSettings]
# when we should nl user status to bounced?
BounceThresholdValue=3

[DebugSettings]
# Debug=enabled|disabled get more log output e.g. bounce parser
Debug=disabled

[NewsletterUserSettings]

# if disabled nl_user.name is created with default shema
# saluation first_name last_name
# if enabled the tpl design:newsletter/user/name.tpl will be used
UseTplForNameGeneration=disabled

# define which salutaions are available
# mapping of nl_user.salutation (int) to english string
# this string is used for i18n
# SalutationMappingArray[value_{$saluataionid}]={i18n english string}
# i18n( {i18n english string}, 'cjw_newsletter/user/salutation' )
SalutationMappingArray[value_1]=Mr
SalutationMappingArray[value_2]=Ms

#
# Match different additional attributes
# to a CJWNL_USER_FIELD
#
# activate a setting block
#
#CustomFieldMappingArray[]=custom_data_text_1

#
# setting block for CJWNL_USER_FIELD attribute matching
#
# name : public name for view(s)
#
#        Translation
#
#        {$name|i18n( 'cjw_newsletter/user_view' )}
#        e.g. {ezini( 'CustomFieldMapping_custom_data_text_1', 'Name', 'cjw_newsletter.ini' )|i18n( 'cjw_newsletter/user_view' )}
#
#[CustomFieldMapping_custom_data_text_1]
#Name=Postcode

[NewsletterFilterSettings]
# which PHP Class Filtertypes are available for this newsletter Installation
AvailableFilterTypeClassArray[]=CjwNewsletterFilterTypeSalutation
AvailableFilterTypeClassArray[]=CjwNewsletterFilterTypeEmail

[NewsletterCsvImportSettings]
#  ,  ;  \t  |
DefaultCsvDelimiter=;
# "Import all" starts ext:cjw_newsletter:import in the background and shows its progress; disabled imports inside the request
# (a server without proc_open falls back to that by itself)
ImportInBackground=enabled
# true or false
DefaultFirstRowIsLabel=false
# true or false
DefaultUtf8Encode=true

#
# sort and mapping csv columns
#
# db field => csv field
# CsvFieldMappingArray[CJWNL_USER_FIELD]=CSV_COLUMN_NAME
# e.g. CsvFieldMappingArray[custom_data_text_1]=postcode
#

# default
CsvFieldMappingArray[email]=email
CsvFieldMappingArray[first_name]=first_name
CsvFieldMappingArray[last_name]=last_name
CsvFieldMappingArray[salutation]=salutation
#CsvFieldMappingArray[custom_data_text_1]=CSV_CUSTOM_COLUMN_NAME_1
#CsvFieldMappingArray[custom_data_text_2]=CSV_CUSTOM_COLUMN_NAME_2
#CsvFieldMappingArray[custom_data_text_3]=CSV_CUSTOM_COLUMN_NAME_3
#CsvFieldMappingArray[custom_data_text_4]=CSV_CUSTOM_COLUMN_NAME_4



# ======================================================================================================================
# cjw_newsletter 4.2.0: one block per feature area. Each area changes only the settings inside its own block.
# Nothing below is read before the area's code exists; the values are the planned defaults. Tables and columns of
# each area: doc/schema-4.2.md.
# ======================================================================================================================

[ExtensionPointSettings]
# Where the areas hook into the shared code (CjwNewsletterExtensionPoints describes every point). The lists start
# empty here; each area adds its lines below, in its own block, under its own [ExtensionPointSettings] header
# ("Handlers[]=..." only: an empty "Handlers[]" line would clear the lines of the areas before it).
# classes with the static methods of the extension points
Handlers[]
# design: templates included on the dashboard, in the send form, in the test send form, in the list edit and view
DashboardBlocks[]
SendFormParts[]
TestFormParts[]
ListEditParts[]
ListViewParts[]

# ---------------------------------------------------------------------------------------------- N1 Deliverability
# Bounces into the kernel suppression list, soft-bounce retries, rate limits and batches, test groups, subscribe and
# unsubscribe by e-mail, suppression import (doc/deliverability.md).

[ExtensionPointSettings]
Handlers[]=CjwNewsletterDeliverabilityHooks
DashboardBlocks[]=design:newsletter/dashboard/deliverability.tpl
SendFormParts[]=design:newsletter/deliverability/send_form_part.tpl
TestFormParts[]=design:newsletter/deliverability/test_form_part.tpl

[DeliverabilitySettings]
# A hard bounce or a complaint puts the address on the kernel suppression list (expMailSuppression, reason bounce /
# complaint), which blocks every optional mail of the site, not only the newsletter. disabled: the newsletter user
# is only marked as bounced, as before 4.2.0.
SuppressHardBounces=enabled
# A soft bounce (or a temporary refusal of the mail server) queues the item again, at most this many times (0 = never),
# the first time after this many seconds, each further time after twice as long.
SoftBounceMaxRetries=2
SoftBounceRetryDelay=3600
# A send older than this many days is not opened again for a retry.
SoftBounceRetryMaxAge=3
# The most rows a CSV file of the suppression import may have (newsletter/suppression_import, the console).
SuppressionImportMaxRows=100000

[ThrottleSettings]
# enabled: the queue sends in batches and keeps to the rates below; a run that stops is resumed by the next one.
# A pause of a transport (newsletter/throttle, ext:cjw_newsletter:deliverability pause) applies even when disabled.
Throttle=disabled
BatchSize=200
# seconds after a batch before the next batch of the same send starts (no run waits: a later run starts it)
PauseBetweenBatches=0
# per transport (smtp, sendmail, file, sms): mails per minute / per hour, 0 = no limit
#MaxPerMinute[smtp]=120
#MaxPerHour[smtp]=5000

[TestSendSettings]
# the most addresses a test group may have
MaxTestGroupSize=25
# the start of the subject of every test mail (empty = none); test mails also carry the header X-Cjwnl-Test: 1
SubjectPrefix=[Test]
# enabled: every address of a test send gets a mail of its own (the testers do not see each other's addresses)
OneMailPerAddress=enabled

[MailInSettings]
# Subscribe and unsubscribe by e-mail at the addresses of the lists (cjwnl_mailin_address, newsletter/mailin_address_list),
# read by the kernel IMAP/POP3 reader together with the bounces ([BounceSettings] MessageListeners[] of
# mailpreferences.ini) or by a newsletter mail account. A subscribe mail only starts a pending subscription: the
# confirmation mail goes to the sender, who must open its link (double opt-in). An unsubscribe mail is honoured: it
# unsubscribes at once when it proves the address (it carries the newsletter's own headers or the subscription's
# code), otherwise the sender gets a mail with the unsubscribe link. The From header alone never changes anything.
MailIn=disabled
# enabled: list+subscribe@example.org and list+unsubscribe@example.org reach the address list@example.org
PlusAddressing=disabled
# the words (subject, then the first line of the text) that ask for a subscribe or an unsubscribe
SubscribeKeywords[]
SubscribeKeywords[]=subscribe
SubscribeKeywords[]=join
SubscribeKeywords[]=anmelden
UnsubscribeKeywords[]
UnsubscribeKeywords[]=unsubscribe
UnsubscribeKeywords[]=leave
UnsubscribeKeywords[]=stop
UnsubscribeKeywords[]=abmelden
# messages from these addresses are never acted on (mail servers, the site's own senders)
IgnoreSenders[]
IgnoreSenders[]=mailer-daemon@*
IgnoreSenders[]=postmaster@*
IgnoreSenders[]=noreply@*
IgnoreSenders[]=no-reply@*
# the most requests one sender may make in a day (0 = no limit)
MaxRequestsPerSenderPerDay=5

# ---------------------------------------------------------------------------------------------- N2 Editorial

[ExtensionPointSettings]
Handlers[]=CjwNewsletterEditorialHooks
DashboardBlocks[]=design:newsletter/dashboard/editorial.tpl
SendFormParts[]=design:newsletter/editorial/send_form_part.tpl
ListEditParts[]=design:newsletter/editorial/list_edit_part.tpl
ListViewParts[]=design:newsletter/editorial/list_view_part.tpl

[ScheduleSettings]
# recurring sends (cjwnl_schedule, admin: newsletter/schedule_list): the queue-create part of the cronjob runs the
# due ones when enabled; ext:cjw_newsletter:schedule run runs them in any case. Nothing happens until a schedule exists.
Schedules=enabled
# the time zone of a schedule without its own; '' = PHP's (date.timezone)
DefaultTimezone=
# classes implementing CjwNewsletterScheduleConditionInterface that a schedule may name
ConditionHandlers[]=CjwNewsletterScheduleConditionNewArticles
# the most schedules one run handles
MaxRunsPerCall=10
# the title of a copy made in mode copy: %title = the title of the template edition, %date = the day of the run
CopyTitle=%title %date
# PHP date() format of %date
CopyTitleDateFormat=Y-m-d

[ArticlePoolSettings]
# the global default pool when neither the list nor the admin (newsletter/article_pool_list) has one; '' = the content root
#DefaultParentNodes[]=2
DefaultClassIdentifiers[]=cjw_newsletter_article
DefaultMaxItems=10
DefaultMaxAgeDays=31
# the attributes the intro of a picked article is taken from, the first one with content (ezxmltext, eztext or ezstring)
IntroAttributes[]=short_description
IntroAttributes[]=teaser_intro
IntroAttributes[]=full_intro
IntroAttributes[]=intro
IntroAttributes[]=description
IntroAttributes[]=summary

[ApprovalSettings]
# lists with approval_required wait for an approval through the collaboration inbox before they can be sent
CollaborationHandler=cjwnewsletterapproval
# who gets the request in the inbox: user content object ids, and user groups (content object ids) whose members get
# it (12 = the Administrator users group of a standard installation); deciding needs the policy newsletter/approve too
ApproverUserIds[]
ApproverGroupIds[]=12
# enabled = the user who asked may approve his own request (not recommended)
AllowSelfApproval=disabled
# enabled = the approvers are notified through the collaboration notification (when they subscribed to it)
Notification=enabled

# ---------------------------------------------------------------------------------------------- N3 Rendering

#[ExtensionPointSettings]
#Handlers[]=CjwNewsletterRenderingHooks
#DashboardBlocks[]=design:newsletter/dashboard/rendering.tpl

[PlaceholderSettings]
# placeholders besides [[name]], [[salutation_name]], [[first_name]], [[last_name]]: [[<key>]] => user attribute;
# every value is HTML-escaped in the HTML part
#Placeholders[email]=email
#Placeholders[organisation]=organisation

[ConditionTagSettings]
# the "newsletter condition" custom tag of ezxmltext and ezrichtext
ConditionTag=enabled

[InterestSettings]
# topics (cjwnl_interest of the list) or eztags
DefaultSource=topics
MaxArticlesPerBlock=5

[LanguageSettings]
# a subscriber without a language, or one the edition has no translation for, gets the list's main language
FallbackToListMainLanguage=enabled

[TextViewSettings]
# the text part rendered from the content with the plain text views (view=plaintext) instead of the HTML part
PlainTextViews=enabled

# The skins (AvailableSkinArray[] above) can have a group of their own:
#[Skin_company]
#Description=Company newsletter
#PreviewImage=newsletter/skin/company/preview.png

# ---------------------------------------------------------------------------------------------- N4 Statistics

#[ExtensionPointSettings]
#Handlers[]=CjwNewsletterStatisticsHooks
#DashboardBlocks[]=design:newsletter/dashboard/statistics.tpl

[TrackingSettings]
# off by default; a list chooses its tracking mode (off, anonymous totals, per person with consent)
Tracking=disabled
# the kernel mail-preference category whose consent allows per-person counting
ConsentCategory=newsletter_statistics
OpenPixel=enabled
# per-person rows older than this are removed; the totals stay
PersonRetentionMonths=12

[ABTestSettings]
SamplePercent=10
Variants=2
# open or click (click when only anonymous totals are kept)
Criterion=open
WaitHours=4

[StatisticsSettings]
ArticleStatsBox=enabled
TrendDays=90

# ---------------------------------------------------------------------------------------------- N5 SMS

#[ExtensionPointSettings]
#Handlers[]=CjwNewsletterSmsHooks
#DashboardBlocks[]=design:newsletter/dashboard/sms.tpl

[SmsSettings]
Sms=disabled
# a group SmsTransport_<name>
Transport=file
ConsentCategory=sms
CodeLength=6
CodeTTL=900
CodeMaxAttempts=5
StopKeywords[]=STOP

[SmsTransport_file]
# writes every SMS as a file (tests, simulated sending)
Class=CjwNewsletterSmsTransportFile
Dir=var/tmp/cjwnl-sms-outbox

#[SmsTransport_http]
#Class=CjwNewsletterSmsTransportHttp
#Url=
#Method=POST
# credentials belong in settings/override, never here

# ---------------------------------------------------------------------------------------------- N6 Import/export and migration

#[ExtensionPointSettings]
#Handlers[]=CjwNewsletterImportExportHooks
#DashboardBlocks[]=design:newsletter/dashboard/importexport.tpl

[ImportMappingSettings]
# the fields a CSV column can be mapped to
MappableFields[]=email
MappableFields[]=salutation
MappableFields[]=first_name
MappableFields[]=last_name
MappableFields[]=organisation
MappableFields[]=custom_data_text_1
MappableFields[]=custom_data_text_2
MappableFields[]=custom_data_text_3
MappableFields[]=custom_data_text_4
MappableFields[]=language
MappableFields[]=phone_number
DefaultConsentSource=import

[EznewsletterImportSettings]
# ext:cjw_newsletter:import-eznewsletter reads the old tables in batches of this size and never changes them
BatchSize=500
